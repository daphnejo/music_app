name: Quality checks

on:
  push:
    branches:
      - agent/mobile-foundation
      - agent/piano-interactions
      - agent/app-polish-auth
      - agent/fix-brand-assets
      - agent/release-hardening
  pull_request:
    branches:
      - main

jobs:
  mobile-typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npx expo prebuild --platform android --clean --no-install
      - name: Reject unused microphone permission
        run: |
          if grep -q "android.permission.RECORD_AUDIO" android/app/src/main/AndroidManifest.xml; then
            echo "Unexpected RECORD_AUDIO permission found in generated AndroidManifest.xml"
            exit 1
          fi
      - run: npx expo export --platform android --output-dir /tmp/expo-dist

  backend-content-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run content:check
